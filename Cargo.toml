[package]
name = "ctos"
version = "0.1.0"
edition = "2021"

[dependencies]
bootloader = "0.9.23"
volatile = "0.2.6"
spin = "0.5.2"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

# Required by the `bootimage` tool so it knows how to turn the kernel
# binary into a bootable disk image.
[package.metadata.bootimage]
# QEMU isa-debug-exit / serial test-args will land with the first
# integration tests (phil-opp testing chapter). Intentionally empty until then.
