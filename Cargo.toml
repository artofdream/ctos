[package]
name = "ctos"
version = "0.1.0"
edition = "2021"

[dependencies]
spin = "0.5.2"

[features]
default = []
# Panic after UART hello so sensors can prove a non-zero QEMU exit.
# Not enabled in the default build or default `cargo test`.
force-fail = []
# ADR-085 B2-P: boot straight to the standing-EL0 SError probe under
# QEMU -accel kvm on real arm64 (Graviton). Skips GIC/timer/virtio/FAT/
# samples (KVM hosts may lack GICv2). Opt-in only; default build unchanged.
b2-serror = []
# ADR-087 negative probe: leave one planted identity page (VIRT_RAM_BASE)
# in kernel TTBR0 before the identity inventory. The walk must print
# `ident: inv-leak` and withhold `ident: inv-ok` / `ident: ok`.
# `scripts/qemu-smoke.sh` builds this and requires the leak to be caught.
inv-leak-probe = []
# ADR-092 (G1) negative probe: leave one EL0-readable mapping of a kernel
# `.data` page in the shared map window before the EL0-reachability walk.
# The walk must print `el0-reach: leak` and withhold `el0-reach: ok`.
reach-leak-probe = []
# ADR-092 (G2) negative probe: map the "read-only" store target EL0-RW, so
# the EL0 store completes; the probe must print `el0: write-succeeded` and
# withhold `el0: write-ok`. Smoke builds both negatives in one kernel.
write-leak-probe = []
# ADR-094 (G4) negative probe: skip the EL0-permission part of the syscall
# user-pointer check (keep only "mapped in user TTBR0"). EL0 can then make
# `SYS_UART_WRITE` read the `_start` stub page; the probe must print
# `el0: sys-ptr leaked` and withhold `el0: sys-ptr ok`.
sysptr-leak-probe = []
# ADR-096 negative probe: also map task B's private frame into task A's
# TTBR0 (a shared-frame bug). Task A then reads B's sentinel; the probe must
# print `t2t: leak` and withhold `t2t: ok`. Smoke builds it with the
# ADR-092/094 negatives in one kernel.
t2t-leak-probe = []
# ADR-097 negative build: the loader maps app text EL0-readable again (the
# ADR-094 RX mapping). The EL0 text load then succeeds, a syscall given a
# text pointer copies, and the live layout shows EL0-readable text; the probe
# must print `xo: leak` and withhold `xo: ok`. Smoke builds it with the other
# EL0 negatives in one kernel.
xo-leak-probe = []
# ADR-098 negative build: undo the PAN fix (SCTLR_EL1.SPAN stays 1 and the
# kernel resumes from EL0 trips with SPSR.PAN clear). The boot probe
# (`pan: enabled` / `pan: el1-fault`) still passes; the live checks must print
# `pan: lost live-syscall …` / `pan: lost after-el0 …` and withhold
# `pan: ok held …`. Smoke builds it with the other EL0 negatives in one kernel.
pan-keep-leak-probe = []
