# Isolated from the kernel `[target.aarch64-ctos] rustflags` (linker.ld).
# Target *name* is aarch64-ctos-user so parent rustflags do not apply.
[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
json-target-spec = true

[build]
target = "aarch64-ctos-user.json"

[target.aarch64-ctos-user]
rustflags = ["-C", "link-arg=-Tlinker.ld"]
