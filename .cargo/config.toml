[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
# Required on nightly 1.100+ (probed 2026-09-08 for the previous
# custom JSON). `.json` target specs still need -Zjson-target-spec.
json-target-spec = true

[build]
target = "aarch64-ctos.json"

[target.aarch64-ctos]
rustflags = ["-C", "link-arg=-Tlinker.ld"]
runner = "scripts/qemu-aarch64.sh"
