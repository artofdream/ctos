[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
# Required on nightly 1.100+ (probed 2026-09-08). Without this, cargo
# rejects x86_64-ctos.json: "`.json` target specs require -Zjson-target-spec".
json-target-spec = true

[build]
target = "x86_64-ctos.json"

[target.'cfg(target_os = "none")']
runner = "bootimage runner"
