# Sensor: build + QEMU aarch64 serial smoke + cargo test (FR-13 / NFR-04).
# Prefer ubuntu-24.04-arm (native aarch64, matches the arm64 workstation). Also run
# ubuntu-24.04 so an x86_64 TCG guest still gates the PR if the ARM
# label is missing or queued.
name: smoke

on:
  push:
  pull_request:

jobs:
  qemu-smoke:
    name: QEMU aarch64 smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04-arm
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Cross-update builds documented prior OS ba6541c (A9 / ADR-030).
          # Default depth 1 cannot see that SHA; fail-closed is correct,
          # but the clone must be deep enough (or qemu-smoke fetches it).
          fetch-depth: 0

      - name: Install nightly + rust-src
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Install qemu-system-aarch64
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm dosfstools mtools  # ADR-107 FAT32 image
          qemu-system-aarch64 --version

      - name: Build, serial hello, cargo test
        run: ./scripts/qemu-smoke.sh
  qemu-nmi-pin:
    # ADR-090 (sponsor D1/D5): unconditional. A skipped job would pass a required check.
    name: QEMU NMI pin smoke (taken SError)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install nightly + rust-src
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Install QEMU build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build meson pkg-config python3-venv flex bison \
            libglib2.0-dev libpixman-1-dev libfdt-dev libslirp-dev \
            dosfstools mtools

      - name: Build pinned QEMU (TYPE_NMI patch)
        run: ./scripts/build-qemu-nmi.sh

      - name: Smoke with taken SError required
        env:
          CTOS_QEMU: ${{ github.workspace }}/tools/qemu-nmi/bin/qemu-system-aarch64
          CTOS_REQUIRE_TAKEN_SERROR: "1"
        run: ./scripts/qemu-smoke.sh

      # ADR-110 (N1): -smp 2, HMP `nmi` with cpu-index=1 while ctos core 1
      # stands at EL0 (taken), plus negatives: nmi to cpu0 and core 1 A-masked
      # (not taken). Fail-closed. The single-core step above is unchanged.
      - name: Core 1 taken SError (-smp 2, cpu-index=1) + negatives
        env:
          CTOS_QEMU: ${{ github.workspace }}/tools/qemu-nmi/bin/qemu-system-aarch64
        run: ./scripts/smp2-serror-pin.sh
  qemu-smp2:
    # ADR-100..105: opt-in SMP probe smoke (QEMU -smp 2). S1 bring-up, S2
    # MMU/PAN/VBAR, S3 broadcast TLBI, S4 PerCpu + EL0 probes on core 1, S5
    # concurrent EL0 on both cores with ASID generations. Plus the -smp 1
    # negative and the S2–S5 leak / reserve-drop negatives. NOT a required
    # check: ADR-091 rev 4 stays one core until a written sponsor accept.
    name: QEMU -smp 2 bring-up (opt-in, ADR-100..105; not required)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly + rust-src
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Install qemu-system-aarch64
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm dosfstools mtools  # ADR-107 FAT32 image
          qemu-system-aarch64 --version

      - name: smp2-probe positive (-smp 2) + negative (-smp 1)
        env:
          CTOS_SMP2_ONLY: "1"
        run: ./scripts/qemu-smoke.sh
  qemu-el2-vserror:
    # ADR-111 (N2): opt-in. Stock QEMU `-M virt,virtualization=on` + the EL2
    # shim (tools/el2-shim, loaded with -device loader at PA 0, _start
    # untouched) gives a taken *virtual* SError (HCR_EL2.VSE) at EL0 with the
    # full image, plus three negatives. NOT a required check; no claim change.
    name: QEMU EL2 shim virtual SError (opt-in, ADR-111; not required)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly + rust-src
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Install qemu-system-aarch64
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm
          qemu-system-aarch64 --version

      - name: Virtual SError via EL2 shim + negatives
        run: ./scripts/el2-vserror-smoke.sh
