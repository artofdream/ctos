# Build the mdBook docs site. Deploy to GitHub Pages on main only.
# PRs prove `mdbook build` + CNAME. A green PR build is not a new
# live-site probe; https://ctos.artof.link is Verified on main after #30
# (deploy 34653046584 + HTTPS 200).
name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege on PRs: build does not need pages:write.
# The deploy job sets its own permissions.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

# Pins must stay in lockstep with scripts/docs-build.sh.
# This job is ubuntu-24.04 (x86_64); Darwin triples live only in the script.
env:
  MDBOOK_VERSION: "0.5.4"
  MDBOOK_MERMAID_VERSION: "0.17.1"

jobs:
  build:
    name: mdBook build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook and mdbook-mermaid
        run: |
          set -euo pipefail
          archive="mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/${archive}" \
            | tar -xz
          mermaid_archive="mdbook-mermaid-v${MDBOOK_MERMAID_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL "https://github.com/badboy/mdbook-mermaid/releases/download/v${MDBOOK_MERMAID_VERSION}/${mermaid_archive}" \
            | tar -xz
          sudo mv mdbook mdbook-mermaid /usr/local/bin/
          mdbook --version
          mdbook-mermaid --version

      - name: Build book
        run: mdbook build

      - name: Confirm CNAME and disable Jekyll
        run: |
          set -euo pipefail
          test -f book/CNAME
          test "$(tr -d '[:space:]' < book/CNAME)" = "ctos.artof.link"
          # Repo-root CNAME must stay in lockstep with book.toml.
          test "$(tr -d '[:space:]' < CNAME)" = "ctos.artof.link"
          # Same files as docs/overview — site and repo stay aligned.
          test -f book/overview/what-can-run.html
          test -f book/overview/porting.html
          test -f book/overview/filesystem.html
          test -f book/overview/hosting-apps.html
          test -f book/overview/measure.html
          test -f book/overview/prerequisites.html
          test -f book/overview/advantages.html
          test -f book/overview/limits.html
          test -n "$(find book \( -name '*mermaid-init*' -o -name '*mermaid.css' \) | head -n 1)"
          test -n "$(find book -name '*theme.css' | head -n 1)"
          grep -q 'class="mermaid"' book/index.html book/overview/*.html
          touch book/.nojekyll

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
