# Build the mdBook docs site. Deploy to GitHub Pages on main only.
# PRs prove `mdbook build` + CNAME. That is not "the site is live."
# One-time admin: Settings → Pages → Source = GitHub Actions
# (has_pages is false until that click). Custom domain is Planned
# until DNS + Settings list ctos.artof.link.
name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege on PRs: build does not need pages:write.
# The deploy job sets its own permissions.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: "0.5.4"

jobs:
  build:
    name: mdBook build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          set -euo pipefail
          archive="mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/${archive}" \
            | tar -xz
          sudo mv mdbook /usr/local/bin/mdbook
          mdbook --version

      - name: Build book
        run: mdbook build

      - name: Confirm CNAME and disable Jekyll
        run: |
          set -euo pipefail
          test -f book/CNAME
          test "$(tr -d '[:space:]' < book/CNAME)" = "ctos.artof.link"
          # Repo-root CNAME must stay in lockstep with book.toml.
          test "$(tr -d '[:space:]' < CNAME)" = "ctos.artof.link"
          # Same files as docs/overview — site and repo stay aligned.
          test -f book/overview/what-can-run.html
          test -f book/overview/porting.html
          test -f book/overview/filesystem.html
          test -f book/overview/hosting-apps.html
          test -f book/overview/measure.html
          test -f book/overview/prerequisites.html
          test -f book/overview/advantages.html
          test -f book/overview/limits.html
          touch book/.nojekyll

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
